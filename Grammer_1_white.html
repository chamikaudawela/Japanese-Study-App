<style>
:root{--bg:#ffffff;--sf:#f3f5fa;--card:#fff;--tx:#202433;--mu:#687386;--ln:#dce1ec;--ac:#405fca;--ok:#1b9b63;--okb:#e8f7ef;--ng:#d64b4b;--ngb:#fff0f0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:auto}.panel{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:14px}

.top{display:flex;justify-content:space-between}.prompt{font-size:1.1rem;line-height:1.9;white-space:pre-wrap;margin:16px 0}

.c.ok{border-color:var(--ok);background:var(--okb)}.c.ng{border-color:var(--ng);background:var(--ngb)}
#fb{margin-top:14px;font-weight:650;min-height:26px}.a{border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;font-size:1rem;font-weight:650;cursor:pointer;margin-top:14px}
.h{display:none!important}.opt{display:block;padding:12px;border:2px solid var(--ln);border-radius:12px;margin:8px 0;cursor:pointer}.opt input{margin-right:8px}.a2{background:var(--card);color:var(--tx);border:2px solid var(--ln)}.mn{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sf);font-weight:650;line-height:1.6}.wi{border-top:1px solid var(--ln);padding:12px 0;line-height:1.7}.wp{font-size:1.05rem}h2{font-size:1.1rem;margin:16px 0 4px}input{font-size:1.1rem;padding:12px;border:2px solid var(--ln);border-radius:12px;width:100%;margin:10px 0;background:var(--card);color:var(--tx)}
#login{max-width:420px;margin:12vh auto;text-align:center}.sc{font-size:1.5rem;font-weight:800}

.tm{font-variant-numeric:tabular-nums;font-weight:700}.rv{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.8rem;margin-left:8px}.mn div{margin:2px 0}.mn .kj{font-size:1.15rem}.wi .pp{white-space:pre-wrap}.prompt{font-size:1.05rem}
rt{font-size:.5em;color:var(--ac);font-weight:600}body.hide-furigana rt{display:none}body.hide-romaji .rl{display:none}body.hide-sinhala .sl{display:none}

.opt .nm{color:var(--mu);font-size:.85rem;margin-left:4px}.wi .qi img{max-height:220px}

<script>
"use strict";

kuho ya, gasu no shiyōsha no hogo o mokuteki to shita hōritsu desu.","si":"පහත වාක්‍යයේ (　) හිස්තැනට ගැලපෙන වචනය තෝරන්න: ගෑස් ව්‍යාපාර පනත යනු නල මාර්ගයෙන් ගෑස් සපයන (　) ගෑස් ව්‍යාපාරය සම්බන්ධයෙන් ආරක්ෂාව තහවුරු කිරීම සහ ගෑස් පාරිභෝගිකයින් ආරක්ෂා කිරීම අරමුණු කරගත් නීතියකි.","options":[{"k":"1","jp":"{都市|とし}","ro":"Toshi","si":"නාගරික (City gas)"},{"k":"2","jp":"LP","ro":"Eru-pī (LP)","si":"LP ගෑස්"}],"answer":"1"},{"n":"P8・第7問B","jp":"あらかじめ{練|ね}り{混|ま}ぜられたコンクリートを、{固|かた}まらないようにかくはんする{機能|きのう}を{備|そな}えたトラックを{何|なん}というか。","ro":"Arakajime nerimazerareta konkurīto o, katamaranai yō ni kakuhan suru kinō o sonaeta torakku o nan to iu ka.","si":"කලින් මිශ්‍ර කරන ලද කොන්ක්‍රීට් ඝන වීම වැළැක්වීම සඳහා කලවම් කරමින් ගෙන යාමේ පහසුකම ඇති ට්‍රක් රථය හඳුන්වන්නේ කුමන නමකින්ද?","options":[{"k":"1","jp":"ホッパ (ほっぱ)","ro":"Hoppa","si":"හොපර් (Hopper)"},{"k":"2","jp":"スランプコーン (すらんぷこーん)","ro":"Suranpu kōn","si":"ස්ලම්ප් කේතුව (Slump cone)"},{"k":"3","jp":"トラックアジテータ (とらっくあじてーた)","ro":"Torakku ajitēta","si":"කොන්ක්‍රීට් මික්සර් ට්‍රක් රථය (Truck agitator)"},{"k":"4","jp":"コンクリートポンプ (こんくりーとぽんぷ)","ro":"Konkurīto ponpu","si":"කොන්ක්‍රීට් පොම්පය (Concrete pump)"}],"answer":"3"},{"n":"P9・第14問","jp":"{以下|いか}の{文章|ぶんしょう}の（　）に{入|はい}る{言葉|ことば}を{選|えら}びなさい。\n{河川工事|かせんこうじ}などの{土木工事|どぼくこうじ}の{現場|げんば}では、{法面|のりめん}でのバックホウの（　）の{事故|じこ}があるので、{注意|ちゅうい}する。","ro":"Ika no bunshō no ( ) ni hairu kotoba o erabinasai. Kasen kōji nado no doboku kōji no genba de wa, norimen de no bakkuhou no ( ) no jiko ga aru no de, chūi suru.","si":"පහත වාක්‍යයේ (　) හිස්තැනට ගැලපෙන වචනය තෝරන්න: ගංගා ඉදිකිරීම් වැනි සිවිල් ඉංජිනේරු වැඩබිම්වල, බෑවුම් මතදී බැක්හෝ යන්ත්‍ර (　) අනතුරු සිදුවන බැවින් සැලකිලිමත් වන්න.","options":[{"k":"1","jp":"{崩壊|ほうかい}・{倒壊|とうかい}","ro":"Hōkai / Tōkai","si":"කඩා වැටීම / බිඳ වැටීම"},{"k":"2","jp":"{飛来|ひらい}・{落下|らっか}","ro":"Hirai / Rakka","si":"ඉහළින් දේවල් වැටීම / විසිවී ඒම"},{"k":"3","jp":"{転倒|てんとう}","ro":"Tentō","si":"පෙරළීම (Overturning)"}],"answer":"3"},{"n":"P9・第10問","jp":"{型枠工事|かたわくこうじ}において、{型枠|かたわく}の{補強|ほきょう}が{不 function toRomaji(s){s=s.replace(/\u3000/g,' ').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
 let out='',i=0,sok=false;
 while(i<s.length){const c=s[i];
  if(c==='\u0001'){out+=' wa ';i++;continue}
  if(c==='\u0002'){out+=' e ';i++;continue}
  if(c==='を'){out+=' o ';i++;continue}
  if(PU[c]!==undefined){out+=PU[c];sok=false;i++;continue}
  if(c==='っ'){sok=true;i++;continue}
  if(c==='ー'){const m=out.match(/[aiueo]$/);out+=m?m[0]:'-';i++;continue}
  if(c==='ん'){const n=s[i+1];out+=(n&&/[あいうえおやゆよ]/.test(n))?"n'":'n';i++;continue}
  let r=null,len=1;const two=s.substr(i,2);
  if(KS[two]){r=KS[two];len=2}else if(KB[c]){r=KB[c]}
  if(r===null){out+=c;sok=false;i++;continue}
  if(sok){r=r.startsWith('ch')?'t'+r:r[0]+r;sok=false}
  out+=r;i+=len}
 return out.replace(/ {2,}/g,' ').replace(/ ([,.?!)])/g,'$1').replace(/\( /g,'(').trim()}

const roOf=(jp,ro)=>ro||toRomaji(jpReading(jp||''));
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a};
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
let queue=[],pos=0,score=0,done=false,seen=new Set(),wrong=[],t0=0,timer=null,total=0;
/* ふりがな / Romaji / සිංහල on-off */
const TG={furigana:"ふりがな",romaji:"Romaji",sinhala:"සිංහල"};
function setTg(k,on){document.body.classList.toggle("hide-"+k,!on);const b=$("tg-"+k);b.textContent=TG[k]+": "+(on?"ON":"OFF");b.classList.toggle("on",on)}
function toggle(k){const on=document.body.classList.contains("hide-"+k);setTg(k,on);try{localStorage.setItem("jft_tg_"+k,on?"1":"0")}catch(e){}}
function initTg(){Object.keys(TG).forEach(k=>{let on=true;try{on=localStorage.getItem("jft_tg_"+k)!=="0"}catch(e){}setTg(k,on);$("tg-"+k).onclick=()=>toggle(k)})}
function unlock(){if($("pw").value==="Japan"){$("login").classList.add("h");$("app").classList.remove("h");initTg();showSel()}else $("msg").textContent="パスワードが違います。"}
const ODN={rev:"最後の問題から",fwd:"最初の問題から",rnd:"ランダム"};
function drawSets(){const b=$("sets");b.replaceChildren();SETS.forEach(s=>{const l=document.createElement("label");l.className="opt";l.innerHTML='<input type="checkbox" value="'+esc(s.id)+'" checked> '+esc(s.title)+'<span class="nm">('+s.items.length+')</span>';l.querySelector("input").onchange=selInfo;b.appendChild(l)})}
function selList(){const od=document.querySelector('input[name="od"]:checked').value,ids=[...document.querySelectorAll("#sets input:checked")].map(i=>i.value),cn=+$("cnt-sel").value;
let a=Q.map((_,k)=>k).filter(k=>ids.includes(Q[k].sid));if(od==="rev")a.reverse();else if(od==="rnd")sh(a);if(cn)a=a.slice(0,cn);return a}
function selInfo(){$("sc").textContent="問題数: "+selList().length+"問"}
function showSel(){clearInterval(timer);if(!$("sets").children.length)drawSets();$("sel").classList.remove("h");$("qp").classList.add("h");$("rs").classList.add("h");$("bar").style.width="0";$("tm").textContent="00:00";$("tot").textContent="セットと順番を選んでください";selInfo()}
function startSel(){const l=selList();if(!l.length){$("sc").textContent="セットを1つ以上選んでください。";return}start(l)}
function start(list){$("sel").classList.add("h");queue=[...list];total=queue.length;pos=0;score=0;seen=new Set();wrong=[];
$("tot").textContent="全"+total+"問（"+ODN[document.querySelector('input[name="od"]:checked').value]+"）";$("qp").classList.remove("h");$("rs").classList.add("h");
clearInterval(timer);t0=Date.now();$("tm").textContent="00:00";timer=setInterval(()=>{$("tm").textContent=fmt(Date.now()-t0)},1000);show()}
const imgs=q=>(q.imgs||[]).map(u=>'<img src="'+u+'" alt="">').join("");
const lines=(jp,ro,si)=>'<div class="rl">'+esc(roOf(jp,ro))+'</div>'+(si?'<div class="sl">'+esc(si)+'</div>':'');
function show(){done=false;const n=queue[pos],q=Q[n],retry=seen.has(n);
$("cnt").textContent="問題 "+(pos+1)+" / "+queue.length;$("rv").classList.toggle("h",!retry);$("no").textContent=q.set+"  (#"+q.n+")";
$("sn").textContent="正解: "+score;$("bar").style.width=(pos/queue.length*100)+"%";
$("qi").innerHTML=imgs(q);$("pr").innerHTML=jpHtml(q.jp);$("pro").textContent=roOf(q.jp,q.ro);$("psi").textContent=q.si||"";$("psi").classList.toggle("h",!q.si);
$("fb").textContent="";$("mn").classList.add("h");$("nx").classList.add("h");
const ch=$("ch");ch.replaceChildren();
q.options.forEach(o=>{const b=document.createElement("button");b.className="c";b.dataset.k=o.k;b.innerHTML='<div class="jt"><b>'+esc(o.k)+'.</b> '+jpHtml(o.jp)+'</div>'+lines(o.jp,o.ro,o.si);b.onclick=()=>pick(b,o.k,n);ch.appendChild(b)})}
function info(q,el){el.replaceChildren();const o=q.options.find(x=>x.k===q.answer);const l=(t,c)=>{const d=document.createElement("div");if(c)d.className=c;d.textContent=t;el.appendChild(d)};
l("正解: "+q.answer+". "+(o?plain(o.jp):""),"kj");if(o){const r=roOf(o.jp,o.ro);if(r){const d=document.createElement("div");d.className="rl";d.textContent=r;el.appendChild(d)}if(o.si){const d=document.createElement("div");d.className="sl";d.textContent=o.si;el.appendChild(d)}}}
function pick(b,k,n){if(done)return;done=true;const q=Q[n],first=!seen.has(n);
document.querySelectorAll(".c").forEach(x=>{x.disabled=true;if(x.dataset.k===q.answer)x.classList.add("ok")});
if(k===q.answer){if(first)score++;$("fb").textContent="正解！ ✅ නිවැරදියි!"}
else{b.classList.add("ng");$("fb").textContent="不正解。正解: "+q.answer+" ❌ වැරදියි!";if(first)wrong.push([n,k]);queue.push(n)}
seen.add(n);$("sn").textContent="正解: "+score;
info(q,$("mn"));$("mn").classList.remove("h");
$("nx").textContent=pos===queue.length-1?"結果を見る":"次の問題";$("nx").classList.remove("h")}
function next(){pos++;if(pos<queue.length){show();window.scrollTo(0,0);return}
clearInterval(timer);const el=Date.now()-t0;
$("qp").classList.add("h");$("rs").classList.remove("h");$("bar").style.width="100%";
const pct=total?score/total*100:0;
$("fs").textContent="得点: "+score+" / "+total+"（1回目）";
$("rt").textContent="正解率: "+pct.toFixed(1)+"%　"+(pct>=60?"PASS ✅（60%以上）":"FAIL ❌（60%未満）")+"　⏱ かかった時間: "+fmt(el);
const w=$("wr");w.replaceChildren();
if(wrong.length){const h=document.createElement("h2");h.textContent="最初に間違えた問題（"+wrong.length+"問）";w.appendChild(h);
wrong.forEach(([n,k])=>{const q=Q[n],d=document.createElement("div");d.className="wi";
const mine=q.options.find(x=>x.k===k),ok=q.options.find(x=>x.k===q.answer);
d.innerHTML='<div class="mu">'+esc(q.set)+' (#'+esc(q.n)+')</div><div class="qi">'+imgs(q)+'</div><div class="pp wp">'+jpHtml(q.jp)+'</div>'+(q.si?'<div class="sl">'+esc(q.si)+'</div>':'')+
'<div>あなたの答え: '+esc(k)+'. '+esc(plain(mine&&mine.jp))+'　→　正解: '+esc(q.answer)+'. '+esc(plain(ok&&ok.jp))+'</div>'+(ok&&ok.si?'<div class="mu">'+esc(ok.si)+'</div>':'');
w.appendChild(d)})}
else w.textContent="全問正解です！🎉"}
$("go").onclick=unlock;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
$("nx").onclick=next;document.querySelectorAll('#sel input[name="od"]').forEach(x=>x.onchange=selInfo);$("cnt-sel").onchange=selInfo;$("sgo").onclick=startSel;$("bk").onclick=showSel;$("rst").onclick=startSel;
</script></body></html>
